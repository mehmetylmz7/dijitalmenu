services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-${MSSQL_SA_PASSWORD:-ChangeMe_12345!}}"
      POSTGRES_DB: "${DB_NAME:-DijitalMenu}"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ConnectionStrings__PostgresConnection: "Host=postgres;Port=5432;Database=${DB_NAME:-DijitalMenu};Username=postgres;Password=${POSTGRES_PASSWORD:-${MSSQL_SA_PASSWORD:-ChangeMe_12345!}}"
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${DB_NAME:-DijitalMenu};Username=postgres;Password=${POSTGRES_PASSWORD:-${MSSQL_SA_PASSWORD:-ChangeMe_12345!}}"
      Seed__AdminUsername: "${SEED_ADMIN_USERNAME:-admin}"
      Seed__AdminPassword: "${SEED_ADMIN_PASSWORD:-Admin123!}"
      ASPNETCORE_ENVIRONMENT: "Production"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
